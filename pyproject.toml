[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baion-vault-method"
version = "0.3.0"
description = "Reference checker for the BAION Vault Method human-AI state contract."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Steven A. Mullins Jr."}
]
keywords = ["ai", "agents", "provenance", "governance", "audit", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.scripts]
bvm-lint = "bvm_lint.cli:main"

[project.urls]
Homepage = "https://github.com/BaionSyS/baion-vault-method"
Repository = "https://github.com/BaionSyS/baion-vault-method"
Issues = "https://github.com/BaionSyS/baion-vault-method/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
